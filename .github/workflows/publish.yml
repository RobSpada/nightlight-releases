# Publishes a Nightlight release when a signed build is pushed to the `upload` branch.
# The build arrives as Nightlight.exe (split into Nightlight.exe.part* when over 100 MB: the Godot 4.7 runtime is
# 110 MB), game.pck (split into <100 MB parts: game.pck.part*), manifest.json and
# manifest.json.sig. Every file is checked against the manifest's SHA-256 before the release is made. The launcher
# itself only accepts a manifest signed with the owner's private release key, which never leaves the owner's side.
name: Publish release
on:
  push:
    branches: [upload]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Reassemble and verify
        run: |
          cat game.pck.part* > game.pck
          rm game.pck.part*
          if ls Nightlight.exe.part* >/dev/null 2>&1; then cat Nightlight.exe.part* > Nightlight.exe; rm Nightlight.exe.part*; fi
          python3 - <<'PY'
          import json, hashlib
          m = json.load(open("manifest.json"))
          for f in [m["launcher"]] + m["files"]:
              n = f["url"].rsplit("/", 1)[1]
              h = hashlib.sha256(open(n, "rb").read()).hexdigest()
              assert h == f["sha256"], f"{n}: sha256 mismatch"
          open("notes.txt", "w").write(m["notes"])
          open("version.txt", "w").write(m["version"])
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat version.txt)
          gh release create "v$VER" Nightlight.exe game.pck manifest.json manifest.json.sig \
            -R "${{ github.repository }}" -t "Nightlight $VER" -F notes.txt --latest
